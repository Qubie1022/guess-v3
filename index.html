<!doctype html><html lang=zh-TW><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>幾A幾B｜版本三</title>
<style>:root{color-scheme:light dark;--bg:#f6f7f9;--fg:#1c1f24;--card:#fff;--mut:#6b7280;--ac:#2563eb;--bd:#d9dde3;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171c;--fg:#e8eaee;--card:#1e232b;--mut:#9aa3b0;--ac:#6ea0ff;--bd:#343b46;--ok:#4ade80;--no:#f87171}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans TC",sans-serif}main{max-width:560px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}h1{font-size:20px;margin:4px 0}h2{font-size:15px;margin:0 0 8px;color:var(--mut)}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);width:8em;letter-spacing:.2em}
button{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button:disabled{opacity:.4;cursor:default}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#msg{min-height:1.5em;margin-top:8px}.bad{color:var(--no)}.good{color:var(--ok)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}.m{color:var(--mut);font-size:13px}.dbg{font-family:monospace;color:var(--no)}.sc{overflow-x:auto}</style></head><body><main><h1>幾A幾B <span class=m>版本3｜代號與 Google 試算表存檔</span></h1>
<div class=c id=login><h2>輸入代號（代號查詢，非真正登入）</h2><div class=r><input type=text id=code maxlength=20 placeholder="英數_-" style="letter-spacing:0"><button id=enter>進入</button><span id=who class=m></span></div></div><div class=c><div class=m id=st></div><div class=r style="margin:8px 0"><input type=text id=in maxlength=4 inputmode=numeric placeholder="0123"><button id=go>送出</button><button class=g id=nw>開新局</button><label class=m><input type=checkbox id=dbg> 除錯模式</label></div><div class=dbg id=dbgans></div><div id=msg></div>
<table><tbody id=rows></tbody></table></div><div class=c><h2>局列表</h2><div id=hist class=sc></div></div></main><script>
const GAS='https://script.google.com/macros/s/AKfycbzLiwdZFpMt1kKBjstJkj0ghBlzvl9MrF2ZzcP3NoE0ewXWa1fegB9-p-ZWo5KLUYc-TQ/exec';
const gasRef=c=>({async get(){const r=await(await fetch(GAS+'?code='+encodeURIComponent(c))).json();return{exists:!!r.found,data:()=>JSON.parse(r.json)}},async set(d){const r=await(await fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({code:c,json:JSON.stringify(d)})})).json();if(!r.ok)throw new Error('試算表回應異常')}});
const V=3,$=s=>document.querySelector(s);
let games=[],vi=-1,dbg=false,store=null,ready=V<3;
const rnd=()=>{const d=[...'0123456789'].sort(()=>Math.random()-.5);return d.slice(0,4).join('')};
const judge=(a,g)=>{let A=0,c=0;for(let i=0;i<4;i++){if(a[i]==g[i])A++;if(a.includes(g[i]))c++}return[A,c-A]};
const hhmm=t=>new Date(t).toLocaleTimeString('zh-TW',{hour12:false});
const cur=()=>games[vi];
function mk(){return{id:games.length+1,answer:rnd(),status:'進行中',started:Date.now(),guesses:[]}}
async function persist(){if(V<3||!store)return;const s=$('#who');s.textContent='儲存中…';
 try{await store.set({json:JSON.stringify(games),vi});s.textContent='已儲存 ✓'}catch(e){s.textContent='儲存失敗：'+(e.message||e.code)}}
function newGame(){
 if(V==1){games=[mk()];vi=0}else{const a=games.find(g=>g.status=='進行中');if(a)a.status='未完成';games.push(mk());vi=games.length-1}
 $('#msg').textContent='';persist();render()}
function resume(i){const a=games.find(g=>g.status=='進行中');if(a)a.status='未完成';games[i].status='進行中';vi=i;persist();render()}
function submit(){
 const g=cur(),el=$('#in'),v=el.value.trim(),m=$('#msg');m.className='';
 if(!g||g.status!='進行中')return;
 if(!/^\d{4}$/.test(v)){m.className='bad';m.textContent='請輸入 4 位數字（可用 0 開頭）';return}
 if(new Set(v).size<4){m.className='bad';m.textContent='4 個數字不可重複';return}
 const[a,b]=judge(g.answer,v);g.guesses.push({n:g.guesses.length+1,g:v,a,b,t:Date.now()});
 if(a==4){g.status='完成';m.className='good';m.textContent='🎉 '+v+'：4A0B，答對了！共猜 '+g.guesses.length+' 次'}else m.textContent=v+' → '+a+'A'+b+'B';
 el.value='';persist();render(true)}
function render(keep){
 const g=cur();$('#in').disabled=$('#go').disabled=!g||g.status!='進行中'||!ready;
 $('#dbgans').textContent=dbg&&g?'除錯答案：'+g.answer:'';
 $('#rows').innerHTML=g?g.guesses.map(x=>`<tr><td>${x.n}</td><td>${x.g}</td><td>${x.a}A${x.b}B</td>${V>1?'<td class=m>'+hhmm(x.t)+'</td>':''}</tr>`).join(''):'';
 $('#st').textContent=g?(V>1?`第 ${g.id} 局・${g.status}${g.status=='進行中'?'':'（僅供查看）'}`:g.status):'尚無遊戲';
 if(!keep&&g&&g.status!='進行中')$('#msg').textContent='';
 if(V>1)$('#hist').innerHTML=games.length?'<table><tr><th>局</th><th>狀態</th><th>猜測</th><th>開始</th><th></th></tr>'+games.map((x,i)=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${x.guesses.length}</td><td class=m>${hhmm(x.started)}</td><td><button class=g onclick="vi=${i};render()">查看</button>${V>2&&x.status!='完成'&&x.status!='進行中'?` <button class=g onclick="resume(${i})">續玩</button>`:''}</td></tr>`).join('')+'</table>':'<span class=m>沒有紀錄</span>'}
$('#go').onclick=submit;$('#in').onkeydown=e=>{if(e.key=='Enter')submit()};
$('#nw').onclick=newGame;$('#dbg').onchange=e=>{dbg=e.target.checked;render(true)};
if(V<3){newGame()}else{ready=false;render();
 const D=async()=>{try{return await (await claude.use('db'))}catch(e){return null}};
 const load=async(ref)=>{store=ref;const s=await ref.get();if(s.exists){const d=s.data();games=JSON.parse(d.json);vi=Math.min(d.vi??games.length-1,games.length-1)}else{games=[];vi=-1}
  ready=true;$('#msg').textContent=games.length?'已讀回 '+games.length+' 局':'此代號沒有紀錄，請開始新局';$('#nw').disabled=false;render();return s.exists};
 $('#nw').disabled=true;
 $('#enter').onclick=async()=>{const w=$('#who');w.className='m';
  const db=true;
  try{
   if(V==3){const c=$('#code').value.trim();if(!/^[A-Za-z0-9_-]{1,20}$/.test(c)){w.textContent='代號僅限英數、_、-（最多 20 字）';return}
    w.textContent='讀取中…';await load(gasRef(c));w.textContent='代號：'+c}
   else{const u=await claude.use('user');const id=u&&await u.id();if(!id){w.textContent='無法取得帳號，請先登入';return}
    w.textContent='讀取中…';const ref=db.collection('data/users/'+id).doc('bulls');store=ref;const s=await ref.get();
    if(s.exists){await load(ref);w.textContent='已找回你的存檔'}else{w.textContent='';$('#create').style.display='block';
     $('#mk').onclick=async()=>{$('#mk').disabled=true;const s2=await ref.get();if(!s2.exists)await ref.set({json:'[]',vi:-1});$('#create').style.display='none';await load(ref);w.textContent='存檔已建立'}}}
  }catch(e){w.textContent='錯誤：'+(e.message||e.code||e)}}}
</script></body></html>
